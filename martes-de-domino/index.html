<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Martes de Dominó</title>
<meta name="description" content="Club de dominó de Ensenada: la tabla del mes, las noches, las fotos y las recetas.">
<meta property="og:type" content="website"><meta property="og:title" content="Martes de Dominó"><meta property="og:description" content="La tabla del mes, las noches, las fotos y las recetas del club"><meta property="og:url" content="https://mundo.cositasdeh.mx/martes-de-domino/"><meta property="og:image" content="https://mundo.cositasdeh.mx/martes-de-domino/portada-general.jpg"><meta property="og:image:width" content="1206"><meta property="og:image:height" content="663"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://mundo.cositasdeh.mx/martes-de-domino/portada-general.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --tinta:#0f0f0e; --hoja:#1a1917; --raya:#2c2a27; --punteo:#3a3733;
  --papel:#f1ece2; --gris:#a8a196; --gris-2:#c9c1b4; --coral:#e8735f; --coral-2:#ffa595;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tinta);color:var(--papel);font-family:var(--sans);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--coral)}a:hover{color:var(--coral-2)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:6px}
.app{max-width:560px;margin:0 auto}
.gutter{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:600;color:var(--gris);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.suave{font-size:13px;color:var(--gris)}

.hero{position:relative;aspect-ratio:4/3.4;max-height:420px;width:100%;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,15,14,.1) 0%,rgba(15,15,14,0) 35%,rgba(15,15,14,.88) 80%,var(--tinta) 100%)}
.hero-text{position:absolute;left:0;right:0;bottom:20px;z-index:1}
.hero-text .eyebrow{color:var(--coral)}
.hero h1{font-size:clamp(50px,15vw,68px);line-height:.9;margin-top:8px}
.volver-mapa{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:8px 12px;border-radius:999px;background:rgba(15,15,14,.7);color:var(--papel);text-decoration:none;font-size:13px}

.ultimo{padding-block:16px 20px;border-bottom:1px solid var(--raya)}
.ganador{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.ganador b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.ganador .pts{font-weight:600;color:var(--coral)}
.ganador small{margin-left:auto;font-size:12px;color:var(--gris)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:13px}
.chip{padding:6px 10px;border:1px solid var(--raya);border-radius:999px}
.chip.menos{color:var(--gris-2)}
.chip.top{background:var(--coral);border-color:var(--coral);color:var(--tinta);font-weight:600}

.bloque{padding-block:30px 0}
.bloque h2{font-size:34px}
.ficha{display:block;width:100%;margin-top:16px;padding:0;border:0;background:var(--hoja);border-radius:18px;overflow:hidden;text-align:left;cursor:pointer;transition:transform .2s ease;text-decoration:none;color:inherit}
.ficha:hover{transform:translateY(-2px);color:inherit}
.ficha .arte{position:relative;background:#f3f1ec}
.ficha .arte img{display:block;width:100%;height:300px;object-fit:cover;object-position:center 35%}
.ficha .tag{position:absolute;top:14px;left:14px;padding:6px 10px;background:var(--tinta);border-radius:999px;font-size:11px;letter-spacing:.14em;font-weight:600}
.ficha .pie{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 18px 18px}
.ficha .fecha{font-family:var(--serif);font-size:40px;line-height:.95}
.ficha .meta{margin-top:8px;font-size:13px;color:var(--gris)}
.ficha .meta b{color:var(--papel);font-weight:600}
.flecha{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--coral);color:var(--tinta);display:grid;place-items:center;font-size:18px}

.proximas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.proxima{min-height:120px;border:1px dashed var(--punteo);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--gris)}
.proxima span:last-child{font-family:var(--serif);font-size:26px;line-height:1.05;color:var(--papel)}

.tabla{margin-top:34px;padding:20px;background:var(--hoja);border-radius:18px}
.tabla h2{font-size:30px}
.tabla ol{list-style:none;margin:12px 0 0;padding:0}
.tabla li{display:grid;grid-template-columns:28px 1fr auto;padding:12px 0;border-bottom:1px solid var(--raya)}
.tabla li:last-child{border-bottom:0}
.tabla li span:first-child{color:var(--gris)}
.tabla li.lider span:first-child,.tabla li.lider span:last-child{color:var(--coral);font-weight:600}
.tabla li.lider span:nth-child(2){font-weight:600}
.tabla .neg{color:var(--gris-2)}
.reglas{margin:12px 0 0;font-size:12px;line-height:1.55;color:var(--gris)}
footer{padding-block:30px 44px;font-size:13px;display:flex;flex-wrap:wrap;gap:16px}
footer a,footer button{color:var(--gris);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

.volver{display:inline-flex;align-items:center;min-height:48px;padding:0;border:0;background:none;color:var(--coral);font-weight:500;font-size:15px;cursor:pointer;text-decoration:none}
.noche-head h1{font-size:50px;line-height:.95;margin-top:4px}
.noche-head p{margin:10px 0 0;color:var(--gris)}
.noche-head p b{color:var(--papel)}
.carrusel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:20px;padding-bottom:6px;scrollbar-width:none;scroll-padding-left:max(22px,env(safe-area-inset-left,0px))}
.carrusel::-webkit-scrollbar{display:none}
.carrusel figure{position:relative;flex:0 0 78%;max-width:340px;margin:0;scroll-snap-align:start}
.carrusel img{display:block;width:100%;height:min(110vw,420px);object-fit:cover;border-radius:14px;background:var(--hoja)}
.carrusel figcaption{position:absolute;left:10px;bottom:10px;padding:5px 10px;background:rgba(15,15,14,.78);border-radius:999px;font-size:12px;color:var(--gris-2)}
.carrusel figcaption b{color:var(--papel);font-weight:600}
.carrusel::after{content:"";flex:0 0 12px}
.vacio{margin-top:20px;padding:22px;border:1px dashed var(--punteo);border-radius:14px;color:var(--gris);font-size:14px}
.cuenta{display:flex;justify-content:space-between;align-items:center;padding-top:10px;font-size:12px;color:var(--gris)}
.puntos{display:flex;gap:5px}
.puntos i{width:5px;height:5px;border-radius:3px;background:var(--punteo);transition:width .2s,background .2s}
.puntos i.on{width:16px;background:var(--coral)}
.accion{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-top:14px;min-height:52px;padding:0 16px;border:1px dashed var(--punteo);border-radius:14px;background:none;color:var(--coral);font-weight:500;cursor:pointer;text-align:left}
.accion small{color:var(--gris);font-weight:400;font-size:12px}
.estado{margin-top:8px;font-size:13px;color:var(--gris-2);min-height:1em}
.estado.error{color:var(--coral-2)}

.partidas{display:flex;flex-direction:column;margin-top:12px;font-size:14px}
.partidas div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--raya)}
.partidas div:last-child{border-bottom:0}
.partidas span:first-child{color:var(--gris)}
.partidas em{font-style:normal;color:var(--gris)}
.partidas .rom{font-family:var(--serif);font-size:22px;color:var(--coral)}
.equipo{margin:6px 0 0;color:var(--gris)}
.equipo b{color:var(--papel);font-weight:600}
.platos{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.plato{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.mini{width:84px;height:84px;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--hoja)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
#grande{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vw,640px);max-height:92vh;overflow:hidden;margin:0;padding:0;background:var(--tinta);border:0}
#grande img{display:block;width:100%;max-height:80vh;object-fit:contain}
#grande form{margin:0;position:absolute;top:10px;right:10px}
#grande button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(15,15,14,.75);color:var(--papel);font-size:20px;cursor:pointer}
.platos .nombre{font-family:var(--serif);font-size:22px;line-height:1.1;margin-top:4px}
.receta{margin-top:16px;padding:16px 18px;background:var(--hoja);border-radius:16px;white-space:pre-line;line-height:1.6}
.receta.pendiente{color:var(--gris);font-size:14px;white-space:normal}
.audios{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.audios figure{margin:0;padding:12px 14px;background:var(--hoja);border-radius:14px}
.audios audio{width:100%}
.audios figcaption{font-size:12px;color:var(--gris);margin-top:6px}
.libreta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:14px;padding-bottom:48px}
.hoja{padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px}
.libreta img{display:block;width:100%;aspect-ratio:2/3;object-fit:contain;background:#fff;border-radius:10px}

dialog{width:min(92vw,400px);border:1px solid var(--raya);border-radius:18px;background:var(--hoja);color:var(--papel);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:30px}
dialog form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
dialog label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--gris-2)}
dialog input{padding:12px 14px;border:1px solid var(--punteo);border-radius:12px;background:var(--tinta);font-size:17px}
.botones{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--punteo);background:none;cursor:pointer;font-weight:500}
.btn.principal{background:var(--coral);border-color:var(--coral);color:var(--tinta)}
.cargando{padding:60px 22px;color:var(--gris);text-align:center}
.vista{animation:entra .35s ease both}
@keyframes entra{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.vista{animation:none}.ficha{transition:none}}
</style>
<script src="../mi-mundo-traffic.js?v=domino-publico-1" defer></script>
</head>
<body>
<div class="app">

<main id="portada" class="vista">
  <header class="hero">
    <img src="portada.jpg" alt="Amigos alrededor de la mesa de dominó">
    <a class="volver-mapa" href="../">← Mi Mundo</a>
    <div class="hero-text gutter">
      <div class="eyebrow">Club de dominó · Ensenada</div>
      <h1>Martes de<br><em>Dominó</em></h1>
    </div>
  </header>
  <div id="contenido"><p class="cargando">Cargando la tabla…</p></div>
  <footer class="gutter" id="pie"></footer>
</main>

<main id="noche" class="vista" hidden></main>

</div>

<dialog id="entrar">
  <h2>Entrar</h2>
  <p class="suave" style="margin:4px 0 0">Solo para subir fotos o la receta. Para ver no hace falta.</p>
  <form id="formEntrar">
    <label for="tel">Tu número de WhatsApp<input id="tel" name="tel" type="tel" inputmode="numeric" autocomplete="username" placeholder="646 123 4567" required></label>
    <label for="pin">PIN<input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <div class="estado" id="estadoEntrar" role="status"></div>
    <div class="botones"><button class="btn" type="button" id="cancelarEntrar">Cancelar</button><button class="btn principal" type="submit">Entrar</button></div>
  </form>
</dialog>

<dialog id="grande" aria-label="Foto del platillo" onclick="if(event.target===this||event.target.id==='grandeImg')this.close()"><img id="grandeImg" alt="Foto del platillo"><form method="dialog"><button aria-label="Cerrar">×</button></form></dialog>
<input type="file" id="archivoFotos" accept="image/*" multiple hidden>
<input type="file" id="archivoAudio" accept="audio/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="../mi-mundo-auth.js"></script>
<script>
(function(){
'use strict';
if (new URLSearchParams(location.search).has('alta')) { location.replace('admin.html' + location.search); return; }

var sb = window.miMundoAuth;
var BUCKET = 'domino';
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var ROMANOS = {1:'I',2:'II',3:'III'};
var datos = { jugadores:{}, noches:[], partidas:[], fotos:[] };
var sesion = null, esAdmin = false, nocheActual = null;

function by(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fechaDe(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function isoDe(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function diaMes(iso){ var d = fechaDe(iso); return d.getDate() + ' de ' + MESES[d.getMonth()]; }
function nombre(id){ return (datos.jugadores[id] || {}).nombre || '¿?'; }
function signo(n){ return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }
function url(path){
  if (!path) return '';
  if (/^https?:/.test(path)) return path;
  if (path.indexOf('subidas/') === 0) return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  return './' + path;
}
function partidasDe(nocheId){ return datos.partidas.filter(function(p){ return p.noche_id === nocheId; }).sort(function(a,b){ return a.numero - b.numero; }); }
function fotosDe(nocheId, tipo){ return datos.fotos.filter(function(f){ return f.noche_id === nocheId && f.tipo === tipo; }).sort(function(a,b){ return a.orden - b.orden || (a.created_at < b.created_at ? -1 : 1); }); }
function puntosDe(lista){
  var t = {};
  lista.forEach(function(p){
    [p.ganador_a, p.ganador_b].forEach(function(j){ t[j] = (t[j]||0) + p.premio; });
    [p.perdedor_a, p.perdedor_b].forEach(function(j){ t[j] = (t[j]||0) - p.premio; });
  });
  return Object.keys(t).map(function(j){ return { id:j, nombre:nombre(j), puntos:t[j] }; })
    .sort(function(a,b){ return b.puntos - a.puntos || a.nombre.localeCompare(b.nombre, 'es'); });
}
function lugares(lista){ var lugar = 0, prev = null; return lista.map(function(r, i){ if (r.puntos !== prev) { lugar = i + 1; prev = r.puntos; } return Object.assign({ lugar:lugar }, r); }); }
function chips(lista){
  return '<div class="chips num">' + lista.map(function(r, i){
    var cls = i === 0 && r.puntos > 0 ? 'chip top' : r.puntos < 0 ? 'chip menos' : 'chip';
    return '<span class="' + cls + '">' + esc(r.nombre) + ' ' + signo(r.puntos) + '</span>';
  }).join('') + '</div>';
}

async function cargar(){
  var r = await Promise.all([
    sb.from('domino_jugadores').select('id,nombre'),
    sb.from('domino_noches').select('*').order('fecha', { ascending:false }),
    sb.from('domino_partidas').select('*'),
    sb.from('domino_fotos').select('*')
  ]);
  var err = r.find(function(x){ return x.error; });
  if (err) throw err.error;
  datos.jugadores = {}; r[0].data.forEach(function(j){ datos.jugadores[j.id] = j; });
  datos.noches = r[1].data; datos.partidas = r[2].data; datos.fotos = r[3].data;
}

function pintarPortada(){
  var jugadas = datos.noches.filter(function(n){ return partidasDe(n.id).length; });
  var html = '';
  var ultima = jugadas[0];
  if (ultima) {
    var res = puntosDe(partidasDe(ultima.id));
    var g = res[0];
    html += '<section class="ultimo gutter" aria-labelledby="t-ultimo"><div class="fila"><span class="eyebrow" id="t-ultimo">Último juego</span><span style="font-size:13px;color:var(--gris-2)">Martes ' + diaMes(ultima.fecha) + '</span></div>' +
      '<div class="ganador"><b>' + esc(g.nombre) + '</b><span class="pts num">' + signo(g.puntos) + '</span><small>ganó la noche</small></div>' +
      chips(res.slice(1)) + '</section>';
  }

  html += '<section class="bloque gutter" aria-labelledby="t-noches"><div class="fila"><h2 id="t-noches">Las noches</h2><span class="suave">' + jugadas.length + (jugadas.length === 1 ? ' noche' : ' noches') + '</span></div>';
  if (!jugadas.length) html += '<p class="vacio">Todavía no hay noches registradas.</p>';
  jugadas.forEach(function(n){
    var ps = partidasDe(n.id), g = puntosDe(ps)[0];
    var arte = n.arte_path || (fotosDe(n.id,'libreta')[0] || fotosDe(n.id,'noche')[0] || {}).path;
    html += '<a class="ficha" href="#noche-' + n.fecha + '" aria-label="Abrir la noche del martes ' + diaMes(n.fecha) + '">' +
      (arte ? '<div class="arte"><img src="' + esc(url(arte)) + '" alt="" loading="lazy"><span class="tag">MARTES</span></div>' : '') +
      '<div class="pie"><div><div class="fecha">' + diaMes(n.fecha) + '</div><div class="meta">' + ps.length + (ps.length === 1 ? ' partida' : ' partidas') + ' · ganó <b>' + esc(g.nombre) + '</b></div></div><span class="flecha" aria-hidden="true">→</span></div></a>';
  });
  html += '</section>';

  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var d = new Date(hoy); d.setDate(d.getDate() + ((2 - d.getDay() + 7) % 7));
  var jugadasSet = {}; jugadas.forEach(function(n){ jugadasSet[n.fecha] = 1; });
  var prox = [];
  while (prox.length < 2) { if (!jugadasSet[isoDe(d)]) prox.push(isoDe(d)); d.setDate(d.getDate() + 7); }
  html += '<section class="bloque gutter" aria-labelledby="t-prox"><h2 id="t-prox">Próximas fechas</h2><div class="proximas">' +
    prox.map(function(f){ return '<div class="proxima"><span class="eyebrow">Martes</span><span>' + diaMes(f) + '</span></div>'; }).join('') + '</div></section>';

  var mesRef = ultima ? ultima.fecha.slice(0,7) : isoDe(hoy).slice(0,7);
  var delMes = datos.partidas.filter(function(p){ var n = datos.noches.find(function(x){ return x.id === p.noche_id; }); return n && n.fecha.slice(0,7) === mesRef; });
  var tabla = lugares(puntosDe(delMes));
  var mesNombre = MESES[+mesRef.slice(5,7) - 1];
  html += '<div class="gutter"><section class="tabla" aria-labelledby="t-tabla"><h2 id="t-tabla">Tabla de ' + mesNombre + '</h2>' +
    (tabla.length ? '<ol class="num">' + tabla.map(function(r, i){
      return '<li' + (r.lugar === 1 && r.puntos > 0 ? ' class="lider"' : '') + '><span>' + r.lugar + '</span><span>' + esc(r.nombre) + '</span><span' + (r.puntos < 0 ? ' class="neg"' : '') + '>' + signo(r.puntos) + '</span></li>';
    }).join('') + '</ol>' : '<p class="suave">Sin partidas este mes.</p>') +
    '<p class="reglas">Pierde la pareja que llega a 100. La que gana se lleva III si termina en 0, II con menos de 50 y I con 50 o más; la que pierde se los resta.</p></section></div>';

  by('contenido').innerHTML = html;
}

function pintarPie(){
  var h = sesion
    ? '<span class="suave">Entraste como ' + esc(nombreSesion()) + '</span><button type="button" id="salir">Salir</button>' + (esAdmin ? '<a href="admin.html">Administrar</a>' : '')
    : '<button type="button" id="abrirEntrar">Entrar para subir fotos o la receta</button>';
  by('pie').innerHTML = h;
  if (by('salir')) by('salir').onclick = async function(){ await sb.auth.signOut(); };
  if (by('abrirEntrar')) by('abrirEntrar').onclick = function(){ abrirEntrar(null); };
}
function nombreSesion(){
  if (!sesion) return '';
  var j = Object.values(datos.jugadores).find(function(x){ return x.user_id === sesion.user.id; });
  return (j && j.nombre) || (sesion.user.user_metadata || {}).domino_username || 'jugador';
}

function pintarNoche(fecha){
  var n = datos.noches.find(function(x){ return x.fecha === fecha; });
  var cont = by('noche');
  if (!n) { cont.innerHTML = '<div class="gutter"><a class="volver" href="#">← Las noches</a><p class="vacio">No encontramos esa noche.</p></div>'; return; }
  nocheActual = n;
  var ps = partidasDe(n.id), res = puntosDe(ps), fotos = fotosDe(n.id,'noche').filter(function(f){ return f.path !== n.entrada_foto && f.path !== n.plato_foto; }), hojas = fotosDe(n.id,'libreta'), audios = fotosDe(n.id,'audio');
  var h = '<div class="gutter"><a class="volver" href="#">← Las noches</a></div>' +
    '<section class="noche-head gutter"><div class="eyebrow">Martes</div><h1>' + diaMes(n.fecha) + '</h1>' +
    (res.length ? '<p>Ganó <b>' + esc(res[0].nombre) + '</b> · ' + ps.length + (ps.length === 1 ? ' partida' : ' partidas') + '</p>' : '') + '</section>';

  if (fotos.length) {
    h += '<div class="carrusel gutter" id="carrusel" aria-label="Fotos de la noche" tabindex="0">' + fotos.map(function(f){
      return '<figure><img src="' + esc(url(f.path)) + '" alt="Foto de la noche" loading="lazy">' + (f.subio_nombre ? '<figcaption>Subió <b>' + esc(f.subio_nombre) + '</b></figcaption>' : '') + '</figure>';
    }).join('') + '</div>' +
    '<div class="cuenta gutter"><span id="cuenta">1 de ' + fotos.length + (fotos.length > 1 ? ' · desliza' : '') + '</span><span class="puntos" id="puntos" aria-hidden="true">' + fotos.map(function(_,i){ return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join('') + '</span></div>';
  } else {
    h += '<div class="gutter"><p class="vacio">Todavía no hay fotos de esta noche.</p></div>';
  }
  h += '<div class="gutter"><button class="accion" type="button" id="compartir">Compartir esta noche<small id="compartirNota">Manda la liga con el dibujo</small></button></div>';
  h += '<div class="gutter"><button class="accion" type="button" id="subirFotos">+ Subir mis fotos de esta noche<small>' + (sesion ? 'Como ' + esc(nombreSesion()) : 'Con tu número y PIN') + '</small></button><div class="estado" id="estadoFotos" role="status"></div></div>';

  if (ps.length) {
    h += '<section class="bloque gutter" aria-labelledby="t-quedo"><h2 id="t-quedo" style="font-size:32px">Así quedó la noche</h2><div class="partidas">' + ps.map(function(p){
      return '<div><span>' + p.numero + '</span><span><strong>' + esc(nombre(p.ganador_a)) + '–' + esc(nombre(p.ganador_b)) + '</strong> <em>ganan a ' + esc(nombre(p.perdedor_a)) + '–' + esc(nombre(p.perdedor_b)) + '</em></span><span class="rom">' + ROMANOS[p.premio] + '</span></div>';
    }).join('') + '</div>' + chips(res) + '</section>';
  }

  h += '<section class="bloque gutter" aria-labelledby="t-cena"><h2 id="t-cena" style="font-size:32px">La cena</h2>';
  var eq = [];
  if (n.chef_id) eq.push('Chef: <b>' + esc(nombre(n.chef_id)) + '</b>');
  if (n.pinche_id) eq.push('Pinche: <b>' + esc(nombre(n.pinche_id)) + '</b>');
  if (eq.length) h += '<p class="equipo">' + eq.join(' · ') + '</p>';
  if (n.entrada || n.plato_fuerte) {
    var plato = function(etq, nom, foto){
      return '<div class="plato">' + (foto ? '<button type="button" class="mini" data-foto="' + esc(url(foto)) + '" aria-label="Ver foto: ' + esc(nom) + '"><img src="' + esc(url(foto)) + '" alt="" loading="lazy"></button>' : '') +
        '<div><div class="eyebrow">' + etq + '</div><div class="nombre">' + esc(nom) + '</div></div></div>';
    };
    h += '<div class="platos">' + (n.entrada ? plato('Entrada', n.entrada, n.entrada_foto) : '') + (n.plato_fuerte ? plato('Plato fuerte', n.plato_fuerte, n.plato_foto) : '') + '</div>';
  }
  if (audios.length) {
    h += '<div class="audios">' + audios.map(function(a){ return '<figure><audio controls preload="none" src="' + esc(url(a.path)) + '"></audio>' + (a.subio_nombre ? '<figcaption>Subió ' + esc(a.subio_nombre) + '</figcaption>' : '') + '</figure>'; }).join('') + '</div>';
  }
  h += n.receta ? '<div class="receta">' + esc(n.receta) + '</div>' : '<p class="receta pendiente">La receta escrita aparece aquí cuando el chef la grabe.</p>';
  h += '<button class="accion" type="button" id="subirAudio">+ Subir el audio de la receta<small>' + (sesion ? 'Como ' + esc(nombreSesion()) : 'Con tu número y PIN') + '</small></button><div class="estado" id="estadoAudio" role="status"></div></section>';

  if (hojas.length) {
    h += '<section class="bloque gutter" aria-labelledby="t-libreta"><h2 id="t-libreta" style="font-size:32px">La libreta</h2><div class="libreta">' +
      hojas.map(function(f){ return '<button type="button" class="hoja" data-foto="' + esc(url(f.path)) + '" aria-label="Ver la hoja en grande"><img src="' + esc(url(f.path)) + '" alt="Hoja de la libreta" loading="lazy"></button>'; }).join('') + '</div></section>';
  } else { h += '<div style="height:48px"></div>'; }

  cont.innerHTML = h;
  by('compartir').onclick = async function(){
    var liga = location.origin + location.pathname.replace(/[^/]*$/, '') + 'noche/' + n.fecha + '/';
    var nota = by('compartirNota');
    try { if (navigator.share) { await navigator.share({ title:'Martes de Dominó · ' + diaMes(n.fecha), url:liga }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(liga); nota.textContent = 'Liga copiada'; }
    catch (_) { nota.textContent = liga; }
  };
  cont.querySelectorAll('[data-foto]').forEach(function(b){ b.onclick = function(){ by('grandeImg').src = b.getAttribute('data-foto'); var d = by('grande'); if (d.showModal) d.showModal(); else d.setAttribute('open',''); }; });
  by('subirFotos').onclick = function(){ conSesion(function(){ by('archivoFotos').click(); }); };
  by('subirAudio').onclick = function(){ conSesion(function(){ by('archivoAudio').click(); }); };
  var c = by('carrusel');
  if (c) {
    var figs = c.querySelectorAll('figure'), pts = cont.querySelectorAll('#puntos i');
    c.addEventListener('scroll', function(){
      var i = 0, mejor = Infinity, x = c.getBoundingClientRect().left;
      figs.forEach(function(f,k){ var d = Math.abs(f.getBoundingClientRect().left - x - 22); if (d < mejor){ mejor = d; i = k; } });
      pts.forEach(function(p,k){ p.classList.toggle('on', k === i); });
      by('cuenta').textContent = (i+1) + ' de ' + figs.length + (figs.length > 1 ? ' · desliza' : '');
    }, { passive:true });
  }
}

var pendiente = null;
function conSesion(fn){ if (sesion) fn(); else abrirEntrar(fn); }
function abrirEntrar(fn){
  pendiente = fn; by('estadoEntrar').textContent = ''; by('estadoEntrar').className = 'estado';
  by('formEntrar').reset();
  if (by('entrar').showModal) by('entrar').showModal(); else by('entrar').setAttribute('open','');
  setTimeout(function(){ by('tel').focus(); }, 50);
}
by('cancelarEntrar').onclick = function(){ by('entrar').close(); pendiente = null; };
by('formEntrar').onsubmit = async function(e){
  e.preventDefault();
  var digitos = by('tel').value.replace(/\D/g,'').slice(-10);
  var est = by('estadoEntrar');
  if (digitos.length !== 10) { est.textContent = 'Escribe tu número de 10 dígitos.'; est.className = 'estado error'; return; }
  est.textContent = 'Comprobando…'; est.className = 'estado';
  var r = await sb.auth.signInWithPassword({ email: digitos + '@domino.cositasdeh.mx', password: by('pin').value });
  if (r.error) { est.textContent = r.error.code === 'invalid_credentials' ? 'El número o el PIN no coinciden.' : 'No se pudo entrar: ' + r.error.message; est.className = 'estado error'; return; }
  by('entrar').close();
  var fn = pendiente; pendiente = null;
  if (fn) setTimeout(fn, 150);
};

async function reducir(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    var bmp = await createImageBitmap(file);
    var max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    var cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(function(res){ cv.toBlob(function(b){ res(b || file); }, 'image/jpeg', .84); });
  } catch (_) { return file; }
}
function ext(file){ var m = (file.name || '').match(/\.([a-z0-9]{2,5})$/i); return m ? m[1].toLowerCase() : (file.type.split('/')[1] || 'bin'); }

async function subir(files, tipo, estadoId){
  var est = by(estadoId), n = nocheActual; if (!n || !files.length) return;
  est.className = 'estado';
  try {
    var base = Math.max(0, ...fotosDe(n.id, tipo).map(function(f){ return f.orden; }));
    for (var i = 0; i < files.length; i++) {
      est.textContent = 'Subiendo ' + (i+1) + ' de ' + files.length + '…';
      var blob = tipo === 'noche' ? await reducir(files[i]) : files[i];
      var esJpg = blob !== files[i];
      var path = 'subidas/' + n.fecha + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + i) + '.' + (esJpg ? 'jpg' : ext(files[i]));
      var up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: esJpg ? 'image/jpeg' : files[i].type, upsert:false });
      if (up.error) throw up.error;
      var ins = await sb.from('domino_fotos').insert({ noche_id:n.id, path:path, tipo:tipo, orden:base + i + 1 });
      if (ins.error) throw ins.error;
    }
    await cargar(); pintarPortada(); pintarNoche(n.fecha);
    var e2 = by(estadoId); if (e2) e2.textContent = files.length === 1 ? 'Listo, ya se ve.' : 'Listo, ya se ven las ' + files.length + '.';
  } catch (err) {
    est.textContent = 'No se pudo subir: ' + (err.message || err); est.className = 'estado error';
  }
}
by('archivoFotos').onchange = function(){ var f = Array.from(this.files); this.value = ''; subir(f, 'noche', 'estadoFotos'); };
by('archivoAudio').onchange = function(){ var f = Array.from(this.files); this.value = ''; subir(f, 'audio', 'estadoAudio'); };

function mostrar(){
  var m = (location.hash || '').match(/^#noche-(\d{4}-\d{2}-\d{2})$/);
  by('portada').hidden = !!m; by('noche').hidden = !m;
  if (m) pintarNoche(m[1]);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', mostrar);

async function revisarSesion(){
  var s = (await sb.auth.getSession()).data.session;
  sesion = s;
  esAdmin = false;
  if (s) { var r = await sb.rpc('mi_mundo_is_admin'); esAdmin = !!r.data; }
  pintarPie();
  if (!by('noche').hidden && nocheActual) pintarNoche(nocheActual.fecha);
}

(async function(){
  try {
    if (!sb) throw Error('No cargó la conexión.');
    await cargar();
    var jr = await sb.from('domino_jugadores').select('id,user_id');
    if (!jr.error) jr.data.forEach(function(j){ if (datos.jugadores[j.id]) datos.jugadores[j.id].user_id = j.user_id; });
    pintarPortada();
    await revisarSesion();
    mostrar();
    sb.auth.onAuthStateChange(function(){ setTimeout(revisarSesion, 0); });
  } catch (err) {
    by('contenido').innerHTML = '<p class="cargando">No se pudo cargar la tabla. Revisa tu conexión y recarga la página.</p>';
    console.error(err);
  }
})();
})();
</script>
